<!doctype html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Saffron Table — Modern Indian Kitchen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>body { font-family: Inter, system-ui, sans-serif; } .serif { font-family: "Playfair Display", serif; }</style>
</head>
<body class="bg-stone-50 text-stone-900">
  <header class="absolute inset-x-0 top-0 z-20">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4 text-white">
      <a href="#" class="serif text-2xl font-bold">Saffron Table</a>
      <nav class="hidden gap-6 text-sm md:flex"><a href="#menu">Menu</a><a href="#reserve">Reserve</a><a href="#visit">Visit</a></nav>
      <button id="cart-btn" class="flex items-center gap-2 rounded-full bg-white/15 px-4 py-2 text-sm font-semibold backdrop-blur hover:bg-white/25"><i data-lucide="shopping-bag" class="h-4 w-4"></i> <span id="cart-count">0</span></button>
    </div>
  </header>

  <section class="relative grid min-h-[85vh] place-items-center bg-cover bg-center text-center text-white" style="background-image:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),url('https://krish-image.invalid/elegant-indian-restaurant-table-with-curries-and-candles-warm-light.jpg?w=1600&h=1000')">
    <div class="px-4">
      <p class="text-sm uppercase tracking-[.3em] text-amber-300">Since 2012 · Jaipur</p>
      <h1 class="serif mt-4 text-5xl font-bold sm:text-7xl">Slow-cooked,<br />made with love</h1>
      <div class="mt-8 flex flex-wrap justify-center gap-3">
        <a href="#menu" class="rounded-full bg-amber-500 px-6 py-3 font-semibold text-stone-950 hover:bg-amber-400">Order online</a>
        <a href="#reserve" class="rounded-full border border-white/50 px-6 py-3 font-semibold hover:bg-white/10">Book a table</a>
      </div>
    </div>
  </section>

  <section id="menu" class="mx-auto max-w-6xl px-4 py-20">
    <h2 class="serif text-center text-4xl font-bold">Our menu</h2>
    <div id="cats" class="mt-6 flex flex-wrap justify-center gap-2"></div>
    <div id="dishes" class="mt-10 grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
  </section>

  <section id="reserve" class="bg-stone-900 py-20 text-white">
    <div class="mx-auto max-w-3xl px-4 text-center">
      <h2 class="serif text-4xl font-bold">Reserve a table</h2>
      <form id="reserve-form" class="mt-8 grid gap-3 text-left sm:grid-cols-2">
        <input id="r-name" required placeholder="Name" class="rounded-xl bg-white/10 px-4 py-3 outline-none focus:ring-2 focus:ring-amber-400" />
        <input id="r-phone" required placeholder="Phone" class="rounded-xl bg-white/10 px-4 py-3 outline-none focus:ring-2 focus:ring-amber-400" />
        <input id="r-date" type="date" required class="rounded-xl bg-white/10 px-4 py-3 outline-none focus:ring-2 focus:ring-amber-400" />
        <select id="r-guests" class="rounded-xl bg-white/10 px-4 py-3 outline-none"><option>2 guests</option><option>4 guests</option><option>6 guests</option><option>8+ guests</option></select>
        <button class="rounded-xl bg-amber-500 py-3 font-semibold text-stone-950 sm:col-span-2">Confirm booking</button>
      </form>
      <p id="reserved" class="mt-4 hidden text-amber-300"></p>
    </div>
  </section>

  <section id="visit" class="mx-auto grid max-w-6xl gap-6 px-4 py-16 text-center sm:grid-cols-3">
    <div><i data-lucide="map-pin" class="mx-auto text-amber-600"></i><p class="mt-2 font-semibold">12 MI Road, Jaipur</p></div>
    <div><i data-lucide="clock" class="mx-auto text-amber-600"></i><p class="mt-2 font-semibold">Daily 12pm – 11pm</p></div>
    <div><i data-lucide="phone" class="mx-auto text-amber-600"></i><p class="mt-2 font-semibold">+91 98765 43210</p></div>
  </section>

  <aside id="cart" class="fixed inset-y-0 right-0 z-30 flex w-full max-w-sm translate-x-full flex-col bg-white shadow-2xl transition-transform">
    <div class="flex items-center justify-between border-b p-4"><h3 class="font-semibold">Your order</h3><button id="cart-close" aria-label="Close"><i data-lucide="x"></i></button></div>
    <div id="cart-items" class="flex-1 space-y-3 overflow-y-auto p-4"></div>
    <div class="border-t p-4"><div class="flex justify-between font-semibold"><span>Total</span><span id="cart-total">₹0</span></div><button id="checkout" class="mt-3 w-full rounded-xl bg-amber-500 py-3 font-semibold">Place order</button></div>
  </aside>
  <div id="toast" class="fixed bottom-6 left-1/2 z-40 -translate-x-1/2 rounded-full bg-stone-900 px-5 py-2.5 text-sm text-white opacity-0 transition-opacity"></div>
  <script src="app.js"></script>
</body>
</html>
