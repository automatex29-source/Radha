<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nova — AI assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>body { font-family: Inter, system-ui, sans-serif; } .dot { animation: blink 1.2s infinite; } .dot:nth-child(2) { animation-delay: .2s } .dot:nth-child(3) { animation-delay: .4s } @keyframes blink { 0%, 80%, 100% { opacity: .2 } 40% { opacity: 1 } }</style>
</head>
<body class="flex h-screen flex-col bg-slate-950 text-slate-100">
  <header class="flex items-center gap-3 border-b border-white/5 px-4 py-3">
    <span class="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-sky-400 to-violet-500"><i data-lucide="bot" class="h-5 w-5"></i></span>
    <div class="flex-1"><h1 class="font-semibold">Nova</h1><p class="text-xs text-emerald-400">● Online</p></div>
    <button id="clear" class="rounded-lg px-3 py-1.5 text-sm text-slate-400 hover:bg-white/5 hover:text-white">New chat</button>
  </header>
  <main id="log" class="flex-1 space-y-4 overflow-y-auto px-4 py-6"></main>
  <div id="starters" class="flex flex-wrap justify-center gap-2 px-4 pb-3"></div>
  <form id="form" class="mx-auto mb-4 flex w-full max-w-3xl gap-2 px-4">
    <input id="input" autocomplete="off" placeholder="Ask Nova anything…" class="flex-1 rounded-2xl border border-white/10 bg-white/5 px-4 py-3 outline-none focus:border-sky-400" />
    <button id="send" class="grid h-12 w-12 place-items-center rounded-2xl bg-sky-500 transition hover:bg-sky-400 disabled:opacity-40" aria-label="Send"><i data-lucide="arrow-up"></i></button>
  </form>
  <script src="app.js"></script>
</body>
</html>
