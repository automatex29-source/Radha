<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neon Snake</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>body { font-family: Inter, system-ui, sans-serif; } canvas { image-rendering: pixelated; touch-action: none; }</style>
</head>
<body class="grid min-h-screen place-items-center bg-[#07070f] text-white">
  <main class="w-full max-w-md px-4 py-8 text-center">
    <h1 class="bg-gradient-to-r from-fuchsia-400 to-cyan-300 bg-clip-text text-4xl font-extrabold tracking-tight text-transparent">Neon Snake</h1>
    <div class="mt-4 flex justify-center gap-6 text-sm text-slate-400">
      <p>Score <span id="score" class="font-bold text-white">0</span></p>
      <p>Best <span id="best" class="font-bold text-white">0</span></p>
    </div>
    <div class="relative mt-4">
      <canvas id="board" width="400" height="400" class="aspect-square w-full rounded-2xl border border-fuchsia-500/30 bg-[#0d0d1c] shadow-[0_0_40px_rgba(217,70,239,.25)]"></canvas>
      <div id="overlay" class="absolute inset-0 grid place-items-center rounded-2xl bg-black/60 backdrop-blur-sm">
        <div>
          <p id="message" class="text-xl font-bold">Ready?</p>
          <button id="start" class="mt-4 rounded-xl bg-fuchsia-500 px-6 py-2.5 font-semibold shadow-lg shadow-fuchsia-500/40 transition hover:bg-fuchsia-400 active:scale-95">Play</button>
          <p class="mt-3 text-xs text-slate-400">Arrow keys / WASD, or swipe · Space to pause</p>
        </div>
      </div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
