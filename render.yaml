# One-click deploy on Render (free plan):
#   https://render.com/deploy?repo=https://github.com/automatex29-source/Radha
# You'll be asked for MONGO_URL (free MongoDB Atlas cluster) and at least one AI key.
# Free options (no card needed): GROQ_API_KEY from https://console.groq.com/keys
# or GEMINI_API_KEY from https://aistudio.google.com/apikey.
services:
  - type: web
    name: radha
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/
    envVars:
      - key: MONGO_URL
        sync: false
      # Free (no card): Gemini 2.5 Flash becomes the default chat model and can see pictures.
      # Keep GROQ_API_KEY too: Groq answers when Gemini's free daily limit runs out.
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Optional, free (no card): a stronger App Builder. Get a key at https://cloud.cerebras.ai
      - key: CEREBRAS_API_KEY
        sync: false
      # Optional: the App Builder's model for everyone, e.g. claude-sonnet-5-5 (with ANTHROPIC_API_KEY, paid).
      - key: BUILDER_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional, free: raises the image/video limits (https://enter.pollinations.ai, sign in with GitHub).
      - key: POLLINATIONS_API_KEY
        sync: false
      # Optional, paid: Flow-level quality (Veo 3.1 video, Nano Banana Pro images) via https://fal.ai
      - key: FAL_KEY
        sync: false
      # Optional, free: lets "Forgot password?" email reset links. Get a key at
      # https://www.brevo.com (SMTP & API > API keys) and set MAIL_FROM to the sender
      # email you verified there. RESEND_API_KEY (https://resend.com) works too.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Optional: where Help Center bug reports and feedback are emailed (defaults to MAIL_FROM).
      - key: SUPPORT_EMAIL
        sync: false
      # The free plan has 512 MB of memory; a headless Chrome would exceed it.
      - key: BROWSER_TOOL
        value: "0"
      # The document-search model needs ~400MB while reading a file; on 512 MB the server was killed
      # mid-upload (502). Files are still read and found by keyword search.
      - key: EMBEDDINGS
        value: "0"
