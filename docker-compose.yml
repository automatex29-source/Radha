# Run RADHA on your computer:
#   1. Copy .env.example to .env and paste in your API keys.
#   2. docker compose up --build
#   3. Open http://localhost:8080
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  radha:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - path: .env
        required: false
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: radha
      # Keys from your .env file or your shell (e.g. GitHub Codespaces secrets).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    ports:
      - "8080:8001"
    volumes:
      - model-cache:/app/cache

volumes:
  mongo-data:
  model-cache:
