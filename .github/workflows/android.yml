# Builds the Krish AI Android app (android/) for Google Play.
# Every change under android/ makes a new build; download it from the run's "Artifacts".
# Optional: to get builds already signed with the upload key, add these repository secrets
# (Settings > Secrets and variables > Actions): ANDROID_KEYSTORE_BASE64 (the .jks file in base64),
# ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS. Without them the build is unsigned and signed afterwards.
name: Android app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      versionCode:
        description: "Version code (raise by 1 for every Play upload)"
        required: false
        default: "1"
      versionName:
        description: "Version name people see, e.g. 1.0.1"
        required: false
        default: "1.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Signing key (if the secrets are set)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "No signing secrets: building unsigned."; exit 0; fi
          echo "$KEYSTORE" | base64 -d > android/upload.jks
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$PASSWORD" "$ALIAS" "$PASSWORD" > android/signing.properties
      - name: Build
        run: >
          gradle -p android --no-daemon
          -PversionCode=${{ github.event.inputs.versionCode || '1' }}
          -PversionName=${{ github.event.inputs.versionName || '1.0.0' }}
          :app:bundleRelease :app:assembleRelease :app:lintRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: krish-android
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/reports/lint-results-release.html
      - name: Remove the key
        if: always()
        run: rm -f android/upload.jks android/signing.properties
