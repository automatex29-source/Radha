# Keeps the Krish AI server awake so scheduled automations run on time.
# Render's free server sleeps after 15 minutes without visits, and a sleeping server can't start a 7:30 AM job.
# Set the repository variable APP_URL (Settings > Secrets and variables > Actions > Variables), for example
# https://radha.onrender.com. Without it this workflow does nothing.
name: Keep server awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the server
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "APP_URL is not set; nothing to do."; exit 0; fi
          curl -fsS --max-time 90 --retry 2 "${APP_URL%/}/api/" > /dev/null && echo "Awake"
