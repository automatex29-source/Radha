<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'">
<title>Krish AI</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --fg: #151a28; --muted: #6b7280; --accent: #ff8a1e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b0d14; --fg: #f5f5f5; --muted: #9ca3af; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 72px; height: 72px; margin-bottom: 18px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { color: var(--muted); margin: 0 0 22px; max-width: 340px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 10px 22px; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
  <div>
    <img src="../build/icon.png" alt="">
    <h1>Can't reach Krish right now</h1>
    <p id="why">Check your internet connection. Krish will try again by itself in a few seconds.</p>
    <button id="retry" type="button">Try again</button>
  </div>
<script>
  const to = new URLSearchParams(location.search).get("to") || "https://krishai.net";
  const go = () => { location.href = to; };
  document.getElementById("retry").onclick = go;
  window.addEventListener("online", go);
  setTimeout(go, 8000);
</script>
</body>
</html>
